name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov

      - name: Run pytest with test coverage check
        env:
          DATABASE_URL: "sqlite:///./nexusai_test.db"
          SUPABASE_POSTGRES_URL: ""
          MONGO_URI: "mongodb://localhost:27017"
          ENCRYPTION_KEY: "T25uc3UwU1k3dVp4cDk4OG9FTUx4QWJIbVpiWXJJMnlwaktOWnBrUWZPRT0="
        run: |
          pytest --cov=nexusai --cov-report=term-missing --cov-fail-under=67
