version: '3.8'

services:
  web:
    build: .
    container_name: nexusai-web
    command: uvicorn nexusai.api.server:app --host 0.0.0.0 --port 8000
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - PORT=8000
      - PYTHONPATH=/app
    restart: unless-stopped
    depends_on:
      - mongodb

  mongodb:
    image: mongo:7.0
    container_name: nexusai-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
