services:
  - type: web
    name: nexusai-central-workspace-hub
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PORT
        value: 8000
      - key: OPENAI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_POSTGRES_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MONGODB_ATLAS_URI
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: nexusai
      - key: ENCRYPTION_KEY
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: DAYTONA_SERVER_URL
        sync: false
