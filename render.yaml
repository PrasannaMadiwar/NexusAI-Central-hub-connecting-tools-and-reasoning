services:
  - type: web
    name: nexusai-hub
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: SUPABASE_POSTGRES_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: MONGODB_ATLAS_URI
        sync: false
      - key: ENCRYPTION_MASTER_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: DAYTONA_API_KEY
        sync: false
      - key: DAYTONA_SERVER_URL
        sync: false
